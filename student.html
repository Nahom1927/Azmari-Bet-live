<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"><meta name="robots" content="noindex"><title>Azmari student</title>
<style>body{font:15px system-ui;margin:0;padding:14px;background:#060B1A;color:#eef;max-width:560px;margin:auto}.card{background:#111a33;border-radius:12px;padding:12px;margin:0 0 12px}input,select,button{display:block;width:100%;box-sizing:border-box;margin:6px 0;padding:10px;border-radius:8px;border:1px solid #345;background:#0b1226;color:#eef;font:inherit}button{background:#5ee38a;color:#041;border:0;font-weight:700}table{width:100%;border-collapse:collapse}td{padding:6px;border-bottom:1px solid #234}</style>
<style id="azmari-responsive-mobile">

  box-sizing: border-box;
}

  width: 100%;
  min-height: 100%;
  overflow-x: hidden;

</head><body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
var sb=supabase.createClient("https://rnqizccrzbolsynfsxbu.supabase.co","sb_publishable_1pbzO1FOGTjIjjE-yF7d1A__OFPESB2");
var app=document.getElementById("app"),ID="",PH="";
function el(t,x,p){var e=document.createElement(t);if(x!=null)e.textContent=x;if(p)for(var k in p)e[k]=p[k];return e}
function card(){var d=el("div");d.className="card";return d}
function inp(ph,type,val){return el("input",null,{placeholder:ph,type:type||"text",value:val||""})}
var SECT=[["attendance","Attendance"],["videos","Uploaded videos"],["live","Live section"],["ear","Ear training"],["theory","Music theory"],["scales","Scales"],["ensemble","Ensemble"],["history","Music history"]];
function login(){app.textContent="";var a=inp("Student ID (AZ-26-0001)"),b=inp("Phone","tel"),m=el("p");
 try{a.value=localStorage.getItem("sid")||""}catch(e){}
 app.append(el("h2","Student login"),a,b,el("button","Open my progress",{onclick:function(){ID=a.value;PH=b.value;show(m)}}),m)}
async function show(m){var r=await sb.rpc("student_progress",{p_student_no:ID,p_phone:PH});
 if(r.error||!r.data){if(m)m.textContent="ID or phone not found.";return}
 try{localStorage.setItem("sid",ID)}catch(e){}
 var d=r.data;app.textContent="";
 var c=card();c.append(el("h2",d.name),el("p","Student ID: "+d.student_no+" · "+(d.instrument||"")+" · "+(d.session||"")));
 var g=card(),t=el("table");g.appendChild(el("h3","Grades"));
 d.grades.forEach(function(x){var tr=el("tr");tr.appendChild(el("td",x.subject));tr.appendChild(el("td",x.score==null?"Not graded":x.score));t.appendChild(tr)});g.appendChild(t);
 var at=d.attendance,a=card();a.append(el("h3","Attendance"),el("p","Present "+at.present+" · Late "+at.late+" · Absent "+at.absent+" · Total "+at.total));
 var u=card();u.appendChild(el("h3","Unlocked now"));u.appendChild(el("p",d.access.length?d.access.join(", "):"Nothing unlocked yet"));
 var k=card(),s=el("select"),cd=inp("4-digit code","tel"),mm=el("p");SECT.forEach(function(o){s.appendChild(el("option",o[1],{value:o[0]}))});cd.maxLength=4;
 k.append(el("h3","Enter your code"),s,cd,el("button","Unlock",{onclick:async function(){var q=await sb.rpc("redeem_code",{p_student_no:ID,p_phone:PH,p_section:s.value,p_code:cd.value});
  if(q.error)mm.textContent=q.error.message;else if(q.data){show()}else mm.textContent="Wrong or expired code."}}),mm);
 app.append(c,g,a,u,k)}
login();
</script>  <script src="student-embed.js"></script>
  <script src="academy-progress.js"></script>
</body></html>
