<style>
@supports not (background: color-mix(in srgb, red 50%, blue)){.top{background:var(--bg)}.bot{background:var(--sf)}.card,.tile,.sec,.tier{background:var(--sf)}.card,.sec,.tile{box-shadow:0 0 0 1px var(--ln)}.btn:not(.ln):not(.gd){box-shadow:none}}
.rw{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:4px 0}
.fi{width:100%;margin:4px 0 8px;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--ink)}
.acl{display:block;height:64px;width:auto;margin:0 0 8px}
.vd{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;margin-top:8px;background:#000;display:block}

.wrow{justify-content:space-between;gap:12px}.wrow h2{text-align:left}
.wbadge{flex:none;display:grid;place-items:center;padding:8px 10px;border-radius:16px;background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border:1px solid rgba(154,232,255,.45);box-shadow:0 6px 18px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.25);backdrop-filter:blur(6px)}
.wlg{width:60px;height:95px}
.xs{display:block;width:100%;height:auto;margin:12px 0 4px;border-radius:10px;position:relative;z-index:1;box-shadow:0 0 0 1px rgba(154,232,255,.3)}
.snow{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}.snow i{position:absolute;top:-8px;left:var(--x);width:var(--s);height:var(--s);border-radius:50%;background:#fff;opacity:.85;animation:snf var(--t) linear infinite;animation-delay:calc(var(--d)*-1)}
@keyframes snf{to{transform:translate(18px,320px)}}
.xs .fl{transform-box:fill-box;transform-origin:50% 100%;animation:flk .45s ease-in-out infinite alternate}@keyframes flk{from{transform:scale(1,.88) skewX(-3deg)}to{transform:scale(1.06,1.08) skewX(3deg)}}
.xs .glow{animation:gl 1s ease-in-out infinite alternate}@keyframes gl{from{opacity:.6}to{opacity:1}}
.xs .win{animation:gl 1.6s ease-in-out infinite alternate}
.xs .lts circle{animation:tw2 1.2s ease-in-out infinite alternate}.xs .lts circle:nth-child(2n){animation-delay:.4s}.xs .lts circle:nth-child(3n){animation-delay:.8s}@keyframes tw2{from{opacity:.3}to{opacity:1}}
.xs .arm{transform-box:fill-box;transform-origin:0 0;animation:str .5s ease-in-out infinite alternate}@keyframes str{from{transform:rotate(-8deg)}to{transform:rotate(10deg)}}
.xs .nts text{animation:nup 3s ease-in infinite;opacity:0}.xs .nts text:nth-child(2){animation-delay:1s}.xs .nts text:nth-child(3){animation-delay:2s}@keyframes nup{0%{opacity:0;transform:translateY(8px)}30%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
.xs .stw{animation:gl 2.4s ease-in-out infinite alternate}
@media (prefers-reduced-motion:reduce){.snow,.xs *{animation:none!important}.xs .nts text{opacity:1}}
.dev .cto{font-weight:500;color:var(--mu);letter-spacing:.04em}
.xcard{position:relative;overflow:hidden;padding:8px;background:#050b24;border-color:rgba(154,232,255,.35)}.xcard .xs{margin:0;box-shadow:none}
</style>

var SND={on:true,ctx:null,src:null,g:null,buf:null,busy:false,playing:false,bd:60/72*4};
try{if(localStorage.getItem("snd")==="0")SND.on=false}catch(e){}
var SR=22050;
/* Slow Ethio-jazz: A tizita-minor 12/8 groove. Light mono loop, pure-JS synthesis (no audio node graph). */
function sndRender(){return new Promise((res,rej)=>setTimeout(()=>{try{res(synth())}catch(e){rej(e)}},80))}
function synth(){
const STEP=1/3,BAR=12,BARS=8,N=Math.round(STEP*BAR*BARS*SR),out=new Float32Array(N),TP=Math.PI*2;
let seed=12345;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/2147483648-1};
const hz=m=>440*Math.pow(2,(m-69)/12);
function voice(t,len,fn){const s0=Math.round(t*SR),n=Math.round(len*SR);for(let j=0;j<n;j++){out[(s0+j)%N]+=fn(j/SR,j)}}
function ep(t,m,v,d){const w=TP*hz(m);voice(t,d+.25,(x)=>{const a=Math.min(1,x/.006),r=x>d?Math.max(0,1-(x-d)/.25):1;return v*a*r*Math.exp(-x*1.9)*(Math.sin(w*x)+.32*Math.sin(2*w*x)*Math.exp(-x*5)+.08*Math.sin(5*w*x)*Math.exp(-x*14))})}
function vib(t,m,v,d){const w=TP*hz(m);voice(t,d+.3,(x)=>{const a=Math.min(1,x/.004),r=x>d?Math.max(0,1-(x-d)/.3):1;return v*a*r*Math.exp(-x*1.5)*(1+.18*Math.sin(TP*4.6*x))*(Math.sin(w*x)+.22*Math.sin(4*w*x)*Math.exp(-x*9))})}
function bass(t,m,v,d){const w=TP*hz(m);voice(t,d+.1,(x)=>{const a=Math.min(1,x/.012),r=x>d?Math.max(0,1-(x-d)/.1):1;return v*a*r*Math.exp(-x*2.2)*(Math.sin(w*x)+.4*Math.sin(2*w*x)*Math.exp(-x*4))})}
function thump(t,v){voice(t,.22,(x)=>v*Math.exp(-x*22)*Math.sin(TP*(95+60*Math.exp(-x*30))*x))}
function brush(t,v){let lp=0;voice(t,.12,(x)=>{const n=rnd();lp+=.55*(n-lp);return v*Math.exp(-x*38)*(n-lp)})}
const CH=[[45,[59,60,64,67]],[38,[60,64,65,69]],[41,[60,64,67,69]],[40,[55,59,62,64]]];
const ML=[[[0,76,3],[3,72,2],[6,71,3],[9,69,3]],[[0,72,3],[3,69,3],[6,71,2],[8,72,4]],[[0,77,3],[3,76,3],[6,72,3],[9,76,3]],[[0,76,6],[6,71,3],[9,72,3]],
[[0,81,3],[3,77,3],[6,76,3],[9,72,3]],[[0,77,3],[3,76,3],[6,72,3],[9,69,3]],[[0,72,3],[3,71,3],[6,69,6]],[[0,71,4],[6,76,6]]];
for(let b=0;b<BARS;b++){const T=b*BAR*STEP,c=CH[b%4],at=s=>T+s*STEP;
bass(at(0),c[0],.34,1.5);bass(at(6),c[0]+7,.2,.8);bass(at(9),c[0]+12,.14,.5);
c[1].forEach(n=>{ep(at(0),n,.075,2.6);ep(at(7),n,.05,1.0);if(b%2)ep(at(10),n,.04,.8)});
thump(at(0),.2);thump(at(6),.12);
[0,3,6,9].forEach(s=>brush(at(s),.05));[2,5,8,11].forEach(s=>brush(at(s),.024));
ML[b].forEach(n=>vib(at(n[0])+.01,n[1],.2,Math.min(2.6,n[2]*STEP+.5)));
}
const dry=Float32Array.from(out),d1=Math.round(.23*SR),d2=Math.round(.37*SR),d3=Math.round(.53*SR);
for(let i=0;i<N;i++)out[i]=dry[i]+.26*dry[(i-d1+N)%N]+.17*dry[(i-d2+N)%N]+.1*dry[(i-d3+N)%N];
let pk=0;for(let i=0;i<N;i++){const a=Math.abs(out[i]);if(a>pk)pk=a}
const k=pk>0?.85/pk:1;for(let i=0;i<N;i++)out[i]*=k;
return out}
function sndPre(){if(SND.buf||SND.busy||!SND.on)return;SND.busy=true;sndRender().then(b=>{SND.buf=b;SND.busy=false;sndSync()}).catch(()=>{SND.busy=false})}
function sndStart(){if(SND.playing||!SND.ctx||SND.ctx.state!=="running")return;
if(!SND.buf){sndPre();return}
const C=SND.ctx;SND.g=C.createGain();SND.g.gain.value=0;SND.g.connect(C.destination);const ab=C.createBuffer(1,SND.buf.length,SR);ab.getChannelData(0).set(SND.buf);const s=C.createBufferSource();s.buffer=ab;s.loop=true;s.connect(SND.g);s.start();SND.src=s;SND.g.gain.setTargetAtTime(.7,C.currentTime,.9);SND.playing=true}
function sndStop(){if(!SND.playing)return;SND.playing=false;const s=SND.src,g=SND.g,C=SND.ctx;g.gain.setTargetAtTime(0,C.currentTime,.2);setTimeout(()=>{try{s.stop();g.disconnect()}catch(e){}},1200)}
function sndSync(){const b=document.getElementById("snd");const want=SND.on&&view==="home"&&!document.hidden;
if(want&&SND.ctx&&SND.ctx.state==="running")sndStart();else sndStop();

let AZ_PUBLIC_POSTS = [];
let AZ_POSTS_LOADING = false;
let AZ_POSTS_LAST_FETCH = 0;

function azEventCode(tierNum) {
  const map = {1:"event_basic",2:"event_bronze",3:"event_silver",4:"event_gold",5:"event_platinum"};
  return map[Number(tierNum)] || "event_silver";
}

function azBuildPostData(kind, extra) {
  const d = Object.assign({}, D[kind] || {});
  const m = M[kind] || {p:[], v:null};
  return Object.assign({
    desc: String(d.desc || "").trim(),
    loc: String(d.loc || "").trim(),
    con: String(d.con || "").trim(),
    photos: Array.isArray(m.p) ? m.p.slice(0, 3) : [],
    video: m.v || null
  }, extra || {});
}

function azRenderMediaCard(item) {
  const photos = Array.isArray(item.photos) ? item.photos.filter(Boolean) : [];
  const vid = item.video || "";
  let html = "";
  if (photos.length) {
    html += '<div class="mgrid" style="margin:8px 0">' + photos.map((u, i) => '<div class="mth"><img src="' + esc(u) + '" alt="Photo ' + (i+1) + '"></div>').join("") + '</div>';
  }
  if (vid) {
    html += '<div class="mth vid" style="margin:8px 0"><video src="' + esc(vid) + '" controls playsinline preload="metadata"></video></div>';
  }
  return html;
}

function azRenderPublicCards(kind, filterFn) {
  if (!Array.isArray(AZ_PUBLIC_POSTS) || !AZ_PUBLIC_POSTS.length) return "";
  return AZ_PUBLIC_POSTS.filter(row => {
    if (!row) return false;
    const k = String(row.kind || row.post_kind || "").trim();
    if (k !== kind) return false;
    const rawData = row.data && typeof row.data === "object" ? row.data : {};
    const item = Object.assign({
      id: row.id,
      title: rawData.title || row.title || "",
      desc: rawData.desc || row.description || "",
      loc: rawData.loc || row.location || "",
      con: rawData.con || row.contact || "",
      by: row.author_name || rawData.by || "",
      phone: row.author_phone || "",
      created_at: row.created_at || row.visible_from || "",
      photos: rawData.photos || [],
      video: rawData.video || ""
    }, rawData);
    return typeof filterFn === "function" ? filterFn(item, row) : true;
  }).map(row => {
    const rawData = row.data && typeof row.data === "object" ? row.data : {};
    const title = rawData.title || rawData.desc || (kind === "store" ? t("store") : kind === "seek" ? "Job seeker" : kind === "band" ? "Band" : kind === "event" ? "Event" : "Job offer");
    const desc = rawData.desc || "";
    const loc = rawData.loc || "";
    const con = rawData.con || row.author_phone || "";
    const dt = row.visible_from || row.created_at;
    return '<div class="card"><b>' + esc(title) + '</b>' +
      (loc ? '<div class="mu">' + esc(loc) + (dt ? " · " + new Date(dt).toLocaleDateString() : "") + '</div>' : "") +
      (desc && desc !== title ? '<p class="mu">' + esc(desc) + '</p>' : "") +
      azRenderMediaCard(rawData) +
      who(row.author_name || "Member", "Approved post") +
      (con ? jobLink(con) : "") + '</div>';
  }).join("");
}

async function azLoadPublicPosts(force) {
  const sb = window.azSupabase;
  if (!sb || AZ_POSTS_LOADING) return;
  if (!force && Date.now() - AZ_POSTS_LAST_FETCH < 20000) return;
  AZ_POSTS_LOADING = true;
  try {
    const r = await sb.rpc("app_list_posts");
    if (!r.error && Array.isArray(r.data)) {
      AZ_PUBLIC_POSTS = r.data;
      AZ_POSTS_LAST_FETCH = Date.now();
      if (typeof render === "function") render();
    }
  } catch (e) {}
  finally {
    AZ_POSTS_LOADING = false;
  }
}

<script>
(function(){
const ld=(k,d)=>{try{return JSON.parse(load(k))||d}catch(e){return d}},sv=(k,v)=>store(k,JSON.stringify(v));
const td=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10),hm=()=>new Date().toTimeString().slice(0,5),g=id=>document.getElementById(id);
const INS=SUBJ,SS=[["P","Present"],["L","Late"],["A","Absent"],["E","Excused"]],TS=[["P","Present"],["L","Late"],["A","Absent"],["V","Leave"]];
let ST=ld("ab_st",[[1,"Selam Tadesse","Krar"],[2,"Abel Girma","Guitar"],[3,"Chala Gemechu","Kebero"],[4,"Amina Yusuf","Vocal"],[5,"Hana Getachew","Piano"]].map(a=>({id:a[0],n:a[1],i:a[2]})));
let TC=ld("ab_tc",[{id:1,n:"Meron Bekele",i:"Krar and masinko"},{id:2,n:"Yonas Haile",i:"Guitar and bass"},{id:3,n:"Tigist Mulugeta",i:"Piano and vocal"}]),SA=ld("ab_sa",{}),TA=ld("ab_ta",{}),TM=false,AX={d:td(),s:"Morning"},TD=td(),LF="All",PLAY=null,LSN=[],OU={};
const LG='';
const hs=s=>{let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return"p"+h+"x"+s.length};
const DB=()=>new Promise((o,x)=>{const r=indexedDB.open("azmari",1);r.onupgradeneeded=()=>r.result.createObjectStore("lessons",{keyPath:"id"});r.onsuccess=()=>o(r.result);r.onerror=()=>x(r.error)});
const dbp=(m,a,w)=>DB().then(d=>new Promise((o,x)=>{const q=d.transaction("lessons",w?"readwrite":"readonly").objectStore("lessons")[m](a);q.onsuccess=()=>o(q.result);q.onerror=()=>x(q.error)}));
const loadL=()=>dbp("getAll").then(a=>{LSN=a.sort((x,y)=>y.t-x.t);if(view==="lessons")render()}).catch(()=>{});
const cs=(a,cur,x,pre)=>a.map(([k,l])=>`<button type="button" class="chip ${cur===k?"on":""}" data-x="${x}" data-v="${pre}${k}">${l}</button>`).join("");
const stat=(D,id,f=v=>v)=>{let p=0,t=0;for(const k in D){const v=f(D[k][id]);if(!v||v==="E"||v==="V")continue;t++;if(v==="P"||v==="L")p++}return p+"/"+t+" · "+(t?Math.round(p*100/t)+"%":"–")};
const lockBar=()=>TM?`<div class="rw"><span class="badge ok">Teacher mode</span><button type="button" class="chip" data-x="lock">🔒 Lock</button></div>`:`<div class="card"><b>Teacher mode</b><p class="mu">Teachers: enter your PIN to upload lessons and take attendance.</p><button type="button" class="btn" data-x="unlock">🔑 Unlock</button></div>`;
const addForm=(p,ph)=>`<div class="card"><h3>Add ${ph}</h3><input class="fi" id="${p}n" placeholder="Full name" autocomplete="off"><select class="f fi" id="${p}i">${INS.map(i=>`<option>${i}</option>`).join("")}</select><button type="button" class="btn" data-x="${p}add">＋ Add ${ph}</button></div>`;
function emb(u){let m=u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);if(m)return"https://www.youtube-nocookie.com/embed/"+m[1];m=u.match(/vimeo\.com\/(\d+)/);return m?"https://player.vimeo.com/video/"+m[1]:null}
function lItem(l){let p="";if(PLAY===l.id){if(l.blob){OU[l.id]=OU[l.id]||URL.createObjectURL(l.blob);p=`<video class="vd" src="${OU[l.id]}" controls playsinline autoplay></video>`}else{const e=emb(l.link);p=e?`<iframe class="vd" src="${e}" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe>`:`<a class="btn" href="${esc(l.link)}" target="_blank" rel="noopener">Open video ↗</a>`}}
return `<div class="card"><div class="rw"><b>${esc(l.title)}</b><span class="badge">${esc(l.inst)}</span></div><div class="mu">${esc(l.by)} · ${new Date(l.t).toLocaleDateString()}${l.blob?" · on this device":" · link"}</div>${l.desc?`<p class="mu">${esc(l.desc)}</p>`:""}${p||`<button type="button" class="btn" data-x="play" data-v="${l.id}">▶ Watch</button>`}${TM?`<button type="button" class="chip" data-x="del" data-v="${l.id}" style="margin-top:8px">🗑 Delete</button>`:""}</div>`}
V.lessons=()=>{const L=LSN.filter(l=>LF==="All"||l.inst===LF);return `${LG}<h2>🎬 Video lessons</h2>${lockBar()}${TM?`<div class="card"><h3>Upload a lesson</h3><input class="fi" id="lt" placeholder="Lesson title" maxlength="80"><select class="f fi" id="li">${INS.map(i=>`<option>${i}</option>`).join("")}</select><textarea class="fi" id="ld" rows="2" maxlength="300" placeholder="Short description (optional)"></textarea><label for="lf">Video file (max 300 MB)</label><input class="fi" id="lf" type="file" accept="video/*"><label for="ll">…or YouTube / Vimeo link</label><input class="fi" id="ll" type="url" placeholder="https://"><button type="button" class="btn" data-x="up">⬆ Upload lesson</button></div>`:""}<div class="chips">${["All",...INS].map(i=>`<button type="button" class="chip ${LF===i?"on":""}" data-x="lf" data-v="${i}">${i}</button>`).join("")}</div>${L.length?L.map(lItem).join(""):`<div class="card"><p class="mu">No lessons yet.</p></div>`}<p class="tt">Files uploaded here stay on this device. Add a YouTube or Vimeo link so every student can watch.</p>`};
V.attend=()=>{const k=AX.d+"|"+AX.s,m=SA[k]||{},me=ST.find(s=>s.n.toLowerCase()===String(S.reg.name||"").trim().toLowerCase());let h=`${LG}<h2>📋 Student attendance</h2>`;if(me)h+=`<div class="card"><b>Your attendance</b><p class="mu">${stat(SA,me.id)}</p></div>`;h+=lockBar();if(!TM)return h;
return h+`<div class="card"><input class="fi" type="date" data-x="ad" value="${AX.d}"><div class="chips">${["Morning","Afternoon","Evening","Weekend"].map(s=>`<button type="button" class="chip ${AX.s===s?"on":""}" data-x="ses" data-v="${s}">${s}</button>`).join("")}</div><button type="button" class="btn ln" data-x="allp">✓ Mark all present</button></div>${ST.map(s=>`<div class="card"><div class="rw"><b>${esc(s.n)}</b><button type="button" class="chip" data-x="srem" data-v="${s.id}" aria-label="Remove">✕</button></div><div class="mu">${esc(s.i)} · Total ${stat(SA,s.id)}</div><div class="chips">${cs(SS,m[s.id],"sg",s.id+"|")}</div></div>`).join("")}${addForm("s","student")}<p class="tt">Late counts as attended. Excused days are not counted.</p>`};
V.tattend=()=>{const m=TA[TD]||{};let h=`${LG}<h2>🧑‍🏫 Teacher attendance</h2>${lockBar()}`;if(!TM)return h;
return h+`<div class="card"><input class="fi" type="date" data-x="td" value="${TD}"></div>${TC.map(t=>{const r=m[t.id]||{};return `<div class="card"><div class="rw"><b>${esc(t.n)}</b><button type="button" class="chip" data-x="trem" data-v="${t.id}" aria-label="Remove">✕</button></div><div class="mu">${esc(t.i)} · Total ${stat(TA,t.id,v=>v&&v.s)}</div><div class="mu">In ${r.in||"–"} · Out ${r.out||"–"}</div><div class="chips">${cs(TS,r.s,"ta",t.id+"|")}</div><div class="rw"><button type="button" class="btn ln" data-x="tin" data-v="${t.id}">⏱ Check in</button><button type="button" class="btn ln" data-x="tout" data-v="${t.id}">⏱ Check out</button></div></div>`}).join("")}${addForm("t","teacher")}`};
const oh=V.home,om=V.more,oz=V.zone,oa=V.academy,links=`<button type="button" class="sec" data-go="live"><span class="ic">📡</span><b>Live station</b></button><button type="button" class="sec" data-go="lessons"><span class="ic">🎬</span><b>Video lessons</b></button><button type="button" class="sec" data-go="attend"><span class="ic">📋</span><b>Student attendance</b></button><button type="button" class="sec" data-go="tattend"><span class="ic">🧑‍🏫</span><b>Teacher attendance</b></button>`;
V.home=()=>liveBan()+oh().replace('<div class="card" style="margin-top:12px">',`<div class="grid" style="margin-top:12px"><button type="button" class="tile" data-go="lessons"><b>🎬</b>Video lessons</button><button type="button" class="tile" data-go="attend"><b>📋</b>Attendance</button><button type="button" class="tile" data-go="tattend" style="grid-column:1/-1"><b>🧑‍🏫</b>Teacher attendance</button><button type="button" class="tile" data-go="live" style="grid-column:1/-1"><b>📡</b>Live station</button></div><div class="card" style="margin-top:12px">`);
V.more=()=>om()+links;
V.academy=()=>{window.azSync&&window.azSync(S.reg,acct,render);const h=oa();return S.reg.status==="paid"?h:LG+h};
V.zone=()=>{let h=oz();const me=ST.find(s=>s.n.toLowerCase()===String(S.reg.name||"").trim().toLowerCase());if(me){const a=stat(SA,me.id);h=h.replace('Attendance 18 / 20<div class="meter"><i style="width:90%"></i></div>',`Attendance ${a.split(" · ")[0]}<div class="meter"><i style="width:${parseInt(a.split(" · ")[1])||0}%"></i></div>`)}return LG+h+links};
document.addEventListener("click",e=>{const b=e.target.closest("[data-x]");if(!b)return;const x=b.dataset.x,v=b.dataset.v;
if(["up","sg","allp","sadd","srem","tadd","trem","ta","tin","tout","del","golive","endlive"].includes(x)&&!TM)return;
switch(x){
case"unlock":{const h=load("ab_pin"),p=prompt(h?"Teacher PIN":"Create a Teacher PIN (4+ characters)");if(!p)return;if(!h){if(p.length<4){toast("PIN too short");return}store("ab_pin",hs(p));TM=true}else if(hs(p)===h)TM=true;else{toast("Wrong PIN");return}break}
case"lock":TM=false;break;case"lf":LF=v;break;case"play":PLAY=+v;break;case"ses":AX.s=v;break;
case"del":if(!confirm("Delete this lesson?"))return;delete OU[v];dbp("delete",+v,1).then(loadL);return;
case"up":{if(needAcct())return;const title=g("lt").value.trim(),link=g("ll").value.trim(),desc=g("ld").value.trim(),f=g("lf").files[0];
if(!title||(!f&&!link)){toast("Add a title and a video file or link");return}
const bad=modr(title+" "+desc);if(bad){toast("Blocked: "+bad);return}
if(!f&&!/^https:\/\//i.test(link)){toast("Link must start with https://");return}
if(f&&(!/^video\//.test(f.type)||f.size>3e8)){toast("Choose a video under 300 MB");return}
const rec={id:Date.now(),t:Date.now(),title,desc,inst:g("li").value,by:(acct&&acct.name)||"Teacher"};if(f)rec.blob=f;else rec.link=link;
