<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="theme-color" content="#060B1A">
<title>Azmari portal</title>
<style>
:root{--bg:#060B1A;--sf:#111a33;--sf2:#0b1226;--ln:#22305a;--ink:#eef2ff;--mu:#9aa8cc;--gr:#5ee38a;--gd:#f2c14e;--rd:#ff8a8a}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#14204a 0,var(--bg) 60%) fixed;color:var(--ink);font:15px/1.5 "Public Sans","Noto Sans Ethiopic",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 40px}
#app{max-width:960px;margin:0 auto;padding:14px}
h1,h2,h3{margin:0 0 8px}h1{font-size:22px}h2{font-size:19px}h3{font-size:16px}
h1 small{display:block;font-size:13px;color:var(--gd);font-weight:400}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}.top .sp{flex:1}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--gd);color:#241a00;font-weight:700;font-size:12px;text-transform:capitalize}
.card{background:color-mix(in srgb,var(--sf) 88%,transparent);border:1px solid var(--ln);border-radius:16px;padding:14px;margin:0 0 12px}
.auth{max-width:420px;margin:8vh auto 0}
label{display:block;margin-top:8px;color:var(--mu);font-size:13px}
input,select,textarea{display:block;width:100%;margin:4px 0;padding:11px;border-radius:10px;border:1px solid var(--ln);background:var(--sf2);color:var(--ink);font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gr);outline-offset:1px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:700;background:var(--gr);color:#04210f;margin:4px 0}
button.ln{background:transparent;color:var(--ink);border:1px solid var(--ln)}
button.gd{background:var(--gd);color:#241a00}
button.sm{padding:6px 10px;font-size:13px;margin:2px}
button.full{width:100%}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}
.tabs button{background:var(--sf);color:var(--mu);border:1px solid var(--ln);white-space:nowrap}
.tabs button.on{background:var(--gr);color:#04210f;border-color:var(--gr)}
.msg{min-height:20px;color:var(--gd)}.msg.err{color:var(--rd)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 5px;border-bottom:1px solid var(--ln);text-align:left}th{color:var(--mu)}
tr.click{cursor:pointer}tr.click:hover{background:#16224a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sec{border:1px solid var(--ln);border-radius:14px;padding:12px;background:var(--sf2);text-align:left}
.sec.open{border-color:var(--gr)}.sec .st{font-size:12px;color:var(--mu)}.sec.open .st{color:var(--gr)}
.big{font-size:40px;letter-spacing:10px;font-weight:800;color:var(--gd);text-align:center;margin:8px 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mu{color:var(--mu)}a{color:var(--gr)}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid var(--ln)}
.pill.p{color:var(--gr);border-color:var(--gr)}.pill.l{color:var(--gd);border-color:var(--gd)}.pill.a{color:var(--rd);border-color:var(--rd)}
.scroll{overflow-x:auto}
.ac-progress{height:10px;background:#30171e;border:1px solid #66303a;border-radius:99px;overflow:hidden;margin:7px 0 4px}.ac-progress i{display:block;height:100%;background:#ef3340;border-radius:99px}.ac-week{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--ln)}.ac-week input{width:20px;min-width:20px;margin:3px 0;accent-color:#ef3340}.ac-done{color:#ff6874}.ac-level{margin:12px 0 5px;color:#ff8a8a;font-weight:800}.ac-locked{opacity:.8}
@media(max-width:520px){.row2{grid-template-columns:1fr}}
</style>
<style id="azmari-responsive-mobile">
*, *::before, *::after {
  box-sizing: border-box;
}

html {
  width: 100%;
  min-height: 100%;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
  touch-action: pan-y;
}

body {
  width: 100%;
  min-width: 0;
  min-height: 100vh;
  min-height: 100dvh;
  margin: 0;
  overflow-x: hidden;
  overflow-y: auto;
  touch-action: pan-y;
}

img, video, canvas, iframe {
  max-width: 100%;
}

input, select, textarea {
  font-size: 16px;
}
</style>

<style id="azmari-theme-sync">
:root{--on:#04210f}
button,.tabs button.on{color:var(--on)}
:root[data-theme="light"]{--bg:#eef4ff;--sf:#ffffff;--sf2:#f3f6ff;--ln:#d3dcf2;--ink:#0d1b3a;--mu:#566488;--gr:#168a4a;--gd:#b07a05;--rd:#b23a30;--on:#ffffff;color-scheme:light}
:root[data-theme="light"] body{background:radial-gradient(1200px 600px at 50% -10%,#dbe8ff 0,var(--bg) 60%) fixed}
:root[data-theme="light"] tr.click:hover{background:#e6eeff}
:root[data-theme="light"] .badge,:root[data-theme="light"] button.gd{color:#fff}
:root[data-theme="light"] .ac-progress{background:#fde8ea;border-color:#f3b6bc}
:root[data-theme="light"] .ac-done{color:#c4202e}:root[data-theme="light"] .ac-level{color:#b23a30}
</style>
<script>
(function(){function pick(){var t=null;try{t=localStorage.getItem("theme")}catch(e){}if(t==="light"||t==="dark")return t;try{return matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}catch(e){return"dark"}}
function apply(){var t=pick();document.documentElement.setAttribute("data-theme",t);var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",t==="light"?"#eef4ff":"#060B1A")}
apply();window.addEventListener("storage",apply);window.addEventListener("focus",apply);window.addEventListener("pageshow",apply);document.addEventListener("visibilitychange",apply);
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",apply)}catch(e){}})();
</script>

      var r = await sb.rpc("admin_list_registrations", { p_status: st.value });
      if (r.error) { say(m, r.error.message, true); return; }
      var rows = r.data || [];
      if (!rows.length) list.appendChild(el("p", "Nothing here.", { className: "mu" }));
      rows.forEach(function (x) {
        var k = card();
        add(k, el("h3", x.name + " · " + x.phone), el("p", [x.instrument, x.session, x.region, x.grade].filter(Boolean).join(" · "), { className: "mu" }));
        if (x.description) k.appendChild(el("p", x.description));
        if (x.location) k.appendChild(el("p", "Location: " + x.location, { className: "mu" }));
        k.appendChild(el("p", "Payment reference: " + (x.payment_ref || "not entered yet") + " · " + new Date(x.created_at).toLocaleString(), { className: "mu" }));
        if (x.status === "approved") k.appendChild(el("span", "Student ID: " + x.student_no, { className: "badge" }));
        if (x.status === "pending") {
          add(k, btn("Approve", async function () {
            var q = await sb.rpc("admin_approve_registration", { p_id: x.id });
            await draw();
            if (q.error) say(m, q.error.message, true); else say(m, "Approved. Student ID: " + q.data + " (tell the student, they log in and link it)");
          }, "sm"), btn("Reject", async function () {
            if (!confirm("Reject this application?")) return;
            var q = await sb.rpc("admin_reject_registration", { p_id: x.id });
            await draw(); if (q.error) say(m, q.error.message, true);
          }, "ln sm"));
        }
        list.appendChild(k);
      });
    }
    st.onchange = draw; add(body, c, list); draw();
  }

  async function paymentsTab(body) {
    var prod = sel([["", "All types"]]), stat = sel([["", "All statuses"], ["pending", "Pending"], ["approved", "Approved"], ["rejected", "Rejected"]]),
      list = el("div"), sum = el("div"), m = msg(), c = card(), ALL = [];
    add(c, el("h3", "Payments"), el("p", "Academy, band profiles, events, job seekers, store posts and rentals from the app.", { className: "mu" }), lab("Type", prod), lab("Status", stat), sum, m);
    function pick(o, names) { for (var i = 0; i < names.length; i++) { var v = o[names[i]]; if (v != null && v !== "") return String(v); } return ""; }
    function nice(code) {
      var s = String(code || "").toLowerCase();
      if (/acad|^reg/.test(s)) return "Academy";
      if (/band/.test(s)) return "Band profile";
      if (/event|^ev/.test(s)) return "Events";
      if (/job|seek/.test(s)) return "Job seeker";
      if (/store|item|rent|sale|post/.test(s)) return "Store post";
      return code ? String(code) : "Other";
    }
    function status(o) { var s = pick(o, ["status", "state"]).toLowerCase(); return s || "pending"; }
    var SHOWN = ["id", "product_code", "status", "state", "reference", "item_ref", "created_at", "name", "phone", "amount", "price", "total", "paid_at", "payment_time", "method"];
    async function load() {
      var r = await sb.rpc("admin_list_orders", { p_limit: 300 });
      if (r.error) { say(m, r.error.message, true); return; }
      ALL = r.data || [];
      var keep = prod.value, seen = {};
      clear(prod); prod.appendChild(el("option", "All types", { value: "" }));
      ALL.forEach(function (o) { var k = pick(o, ["product_code"]); if (k && !seen[k]) { seen[k] = 1; prod.appendChild(el("option", nice(k) + " (" + k + ")", { value: k })); } });
      prod.value = keep; draw();
    }
    function draw() {
      clear(list); clear(sum);
      var rows = ALL.filter(function (o) {
        return (!prod.value || pick(o, ["product_code"]) === prod.value) && (!stat.value || status(o) === stat.value);
      });
      var by = {};
      rows.forEach(function (o) { var k = nice(pick(o, ["product_code"])), s = status(o); by[k] = by[k] || {}; by[k][s] = (by[k][s] || 0) + 1; });
      Object.keys(by).forEach(function (k) {
        sum.appendChild(el("p", k + ": " + Object.keys(by[k]).map(function (s) { return by[k][s] + " " + s; }).join(" · "), { className: "mu" }));
      });
      if (!rows.length) list.appendChild(el("p", "No payments match.", { className: "mu" }));
      rows.forEach(function (o) {
        var k = card(), st = status(o), code = pick(o, ["product_code"]);
        add(k, el("h3", nice(code) + (pick(o, ["item_ref"]) ? " · " + pick(o, ["item_ref"]) : "")));
        var who = [pick(o, ["name"]), pick(o, ["phone"])].filter(Boolean).join(" · ");
        if (who) k.appendChild(el("p", who));
        var amt = pick(o, ["amount", "price", "total"]);
        k.appendChild(el("p", "Reference: " + (pick(o, ["reference"]) || "none") + (amt ? " · " + amt + " birr" : ""), { className: "mu" }));
        var when = pick(o, ["paid_at", "payment_time", "created_at"]);
        if (when) k.appendChild(el("p", new Date(when).toString() === "Invalid Date" ? when : new Date(when).toLocaleString(), { className: "mu" }));
        var extra = Object.keys(o).filter(function (key) { return SHOWN.indexOf(key) < 0 && o[key] != null && o[key] !== "" && String(o[key]).length < 90; })
          .map(function (key) { return key + ": " + o[key]; }).join(" · ");
        if (extra) k.appendChild(el("p", extra, { className: "mu", style: "font-size:12px" }));
        k.appendChild(el("span", st, { className: "badge" }));
        if (st === "pending" && o.id != null) {
          add(k, btn("Approve", async function () { await decide(o, true); }, "sm"), btn("Reject", async function () { if (confirm("Reject this payment?")) await decide(o, false); }, "ln sm"));
        }
        list.appendChild(k);
      });
    }
    async function decide(o, ok) {
      var q = await sb.rpc("admin_decide_order", { p_key: String(o.id), p_approve: ok });
      if (q.error) { say(m, q.error.message, true); return; }
      say(m, ok ? "Approved." : "Rejected."); await load();
    }
    prod.onchange = draw; stat.onchange = draw;
    add(body, c, list); load();
  }

  /* ---------- admin ---------- */
  function registerTab(body) {
    var c = card(), n = inp("Full name"), p = inp("Phone (09...)", "tel"), i = inp("Instrument"), ses = sel([["Evening", "Evening"], ["Morning", "Morning"], ["Weekend", "Weekend"]]), m = msg(), out = el("div");
    out.className = "big";
    add(c, el("h3", "Register student"), lab("Full name", n), lab("Phone", p), lab("Instrument", i), lab("Session", ses),
      btn("Create Student ID", async function () {
        if (n.value.trim().length < 2 || p.value.replace(/\D/g, "").length < 9) { say(m, "Enter a name and a valid phone.", true); return; }
        var r = await sb.rpc("admin_enroll", { p_name: n.value, p_phone: p.value, p_instrument: i.value, p_session: ses.value });
        if (r.error) { say(m, r.error.message, true); return; }
        say(m, "Give this ID to the student. They log in, then link it."); out.textContent = r.data; out.style.letterSpacing = "2px";
      }, "full"), out, m);
    body.appendChild(c);
  }
  async function teamTab(body) {
    var c = card(), email = inp("teacher@example.com", "email"), role = sel([["teacher", "Teacher"], ["admin", "Admin"], ["none", "Remove access"]]), m = msg(), list = el("div");
    add(c, el("h3", "Give a role"), el("p", "The person must create an account first (Create account on the login page).", { className: "mu" }),
      lab("Email", email), lab("Role", role),
      btn("Save role", async function () {
        var r = await sb.rpc("admin_set_role", { p_email: email.value, p_role: role.value });
        if (r.error) { say(m, r.error.message, true); return; }
        say(m, "Saved."); email.value = ""; draw();
      }, "full"), m);
    async function draw() {
      clear(list); var r = await sb.rpc("admin_list_staff");
      (r.data || []).forEach(function (x) { var row = el("div"); add(row, el("span", x.role, { className: "badge" }), el("span", " " + x.email)); row.style.padding = "5px 0"; list.appendChild(row); });
    }
    var lc = card(); add(lc, el("h3", "Staff"), list);
    add(body, c, lc); draw();
  }

  /* ---------- start ---------- */
  async function boot() {
    var s = await sb.auth.getSession();
    if (!s.data.session) { authView(); return; }
    var r = await sb.rpc("my_role");
    if (r.error) { authView("Could not load your role. Make sure the v2 SQL was run. " + r.error.message); return; }
    ME = r.data;
    if (ME.role === "student") studentView();
    else if (ME.role === "admin" || ME.role === "teacher") staffView(ME.role);
    else claimView();
  }
  boot();
})();
</script>  <script src="../academy-progress.js"></script>
