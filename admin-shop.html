<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop approvals</title>
<style>body{font:15px system-ui;background:#0b1020;color:#eef;max-width:760px;margin:auto;padding:16px}
input,button{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid #445;background:#141b33;color:#eef}
button{cursor:pointer}.card{border:1px solid #445;border-radius:10px;padding:12px;margin:10px 0;background:#141b33}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}</style>
<div id="app"></div>
<script>
var API = location.hostname.endsWith('github.io') ? 'https://YOUR-BACKEND-URL' : location.origin;
var app = document.getElementById('app'), token = null;
try { token = sessionStorage.getItem('shop_admin_token'); } catch (e) {}

function el(tag, text, parent) { var n = document.createElement(tag); if (text) n.textContent = text; if (parent) parent.appendChild(n); return n; }
function btn(label, fn, parent) { var b = el('button', label, parent); b.onclick = fn; return b; }
async function api(path, method, body) {
  var r = await fetch(API + path, { method: method || 'GET',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
    body: body ? JSON.stringify(body) : undefined });
  var d = await r.json().catch(function () { return {}; });
  if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
  return d;
}
function loginView() {
  app.textContent = ''; el('h2', 'Shop admin login', app);
  var p = el('input', '', app); p.placeholder = 'Phone (+251...)';
  var w = el('input', '', app); w.type = 'password'; w.placeholder = 'Password';
  var msg = el('p', '', app);
  btn('Log in', async function () {
    try {
      var r = await fetch(API + '/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: p.value.trim(), password: w.value }) });
      var d = await r.json();
      if (!r.ok || !d.token) throw new Error(d.error || 'Login failed');
      token = d.token; try { sessionStorage.setItem('shop_admin_token', token); } catch (e) {}
      load();
    } catch (e) { msg.textContent = e.message; }
  }, app);
}
async function act(path, body) {
  try { await api(path, 'PATCH', body); load(); } catch (e) { alert(e.message); }
}
async function load() {
  var d;
  try { d = await api('/api/admin/overview'); } catch (e) { return loginView(); }
  app.textContent = '';
  var top = el('div', '', app); el('h2', 'Shop approvals', top);
  btn('Refresh', load, top);
  btn('Log out', function () { try { sessionStorage.removeItem('shop_admin_token'); } catch (e) {} token = null; loginView(); }, top);

  el('h3', 'Pending ads (' + d.listings.length + ')', app);
  if (!d.listings.length) el('p', 'Nothing waiting.', app);
  d.listings.forEach(function (l) {
    var c = el('div', '', app); c.className = 'card';
    el('b', l.title, c);
    el('div', l.price + ' ETB · ' + l.city, c);
    el('div', 'Seller: ' + l.seller_name + ' ' + l.phone + ' (' + l.seller_status + ')', c);
    var r = el('div', '', c); r.className = 'row';
    btn('Approve', function () { act('/api/admin/listings/' + l.id, { status: 'approved' }); }, r);
    btn('Reject', function () { act('/api/admin/listings/' + l.id, { status: 'rejected' }); }, r);
  });

  el('h3', 'Sellers (limit: 10 free ads)', app);
  d.sellers.forEach(function (s) {
    var c = el('div', '', app); c.className = 'card';
    el('b', s.name + ' ' + s.phone + ' — ' + s.seller_status, c);
    var r = el('div', '', c); r.className = 'row';
    btn('Approve seller (unlimited)', function () { act('/api/admin/users/' + s.id, { seller_status: 'approved' }); }, r);
    btn('Block', function () { act('/api/admin/users/' + s.id, { seller_status: 'blocked' }); }, r);
  });

  el('h3', 'Reports', app);
  d.reports.forEach(function (x) {
    var c = el('div', '', app); c.className = 'card';
    el('b', x.title, c); el('div', x.reason, c);
    var r = el('div', '', c); r.className = 'row';
    btn('Remove ad', function () { act('/api/admin/listings/' + x.listing_id, { status: 'removed' }); }, r);
  });
}
token ? load() : loginView();
</script>
